
security:
    # Configuración del cifrado de contraseñas
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Proveedor de usuarios desde la base de datos
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Desactiva la seguridad en herramientas de desarrollo y recursos estáticos
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall principal
        main:
            lazy: true
            provider: app_user_provider

            # Inicio de sesión mediante formulario
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_ticket_index

            # Cierre de sesión
            logout:
                path: /logout
                target: app_home

    # Protección de las rutas
    access_control:
        - { path: ^/tickets, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
