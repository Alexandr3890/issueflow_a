
# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    session: true

    # Usar tokens CSRF tradicionales almacenados en la sesión.
    csrf_protection:
        stateless_token_ids: []

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
